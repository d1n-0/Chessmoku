<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <script src="/js/theme.js"></script>
    <title>Chessmoku</title>
    <link rel="icon" href="/assets/wN.svg" />
    <link rel="stylesheet" href="/styles/base.css" />
    <link rel="stylesheet" href="/styles/game.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/">Chessmoku</a>
      <nav>
        <button
          id="open-mode"
          class="mobile-panel-toggle"
          aria-haspopup="dialog"
        >
          대국
        </button>
        <button
          id="open-history"
          class="mobile-panel-toggle"
          aria-haspopup="dialog"
        >
          기보
        </button>
        <a href="/rules" target="_blank" rel="noopener">규칙</a>
        <button
          id="theme-toggle"
          class="theme-toggle"
          aria-label="다크 모드"
          aria-pressed="false"
          title="다크 모드로 전환"
        >
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <circle
              cx="12"
              cy="12"
              r="9"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            />
            <path d="M12 3a9 9 0 0 1 0 18Z" fill="currentColor" />
          </svg>
        </button>
      </nav>
    </header>
    <main class="game-layout">
      <aside id="mode-slot" class="mode-sidebar">
        <section class="panel mode-panel" aria-label="대국 모드">
          <div class="mode-tabs">
            <button id="local-mode" class="active">오프라인</button
            ><button id="online-mode">온라인 친선전</button>
          </div>
          <div id="local-controls">
            <button id="new-game" class="full">새 대국 시작</button>
          </div>
          <div id="online-controls" hidden>
            <form id="name-form" class="room-name-form">
              <label class="sr-only" for="player-name">이름</label>
              <input
                id="player-name"
                placeholder="이름"
                maxlength="16"
                value="플레이어"
                required
              />
              <button id="save-name" type="submit" hidden>변경</button>
            </form>
            <div id="lobby">
              <button id="create-room" class="full">친선전 방 만들기</button>
              <form id="join-form">
                <label class="sr-only" for="room-input">6자리 방 코드</label
                ><input
                  id="room-input"
                  maxlength="6"
                  placeholder="방 코드"
                  autocomplete="off"
                  pattern="[a-zA-Z2-9]{6}"
                  required
                /><button type="submit">입장</button>
              </form>
            </div>
            <div id="room-details" hidden>
              <button
                id="copy-code"
                class="room-code full"
                title="방 코드 복사"
                aria-label="방 코드 복사"
              ></button>
              <p id="connection"></p>
              <button id="ready-game" class="full">준비</button>
              <p id="time-settings-summary"></p>
              <details id="host-controls" hidden>
                <summary>방 관리</summary>
                <form id="room-settings">
                  <label
                    >착수 제한 (초, 0은 무제한)<input
                      id="turn-seconds"
                      type="number"
                      min="0"
                      max="3600"
                      value="0"
                      required
                  /></label>
                  <label
                    >총 시간 (분, 0은 무제한)<input
                      id="total-minutes"
                      type="number"
                      min="0"
                      max="1440"
                      step="0.1"
                      value="0"
                      required
                  /></label>
                  <label
                    >착수 후 추가 (초)<input
                      id="increment-seconds"
                      type="number"
                      min="0"
                      max="600"
                      value="0"
                      required
                  /></label>
                  <button id="save-settings" class="full">설정 적용</button>
                </form>
                <form id="assign-form">
                  <label for="assign-player">대기자</label
                  ><select id="assign-player"></select>
                  <label for="assign-color">자리</label
                  ><select id="assign-color">
                    <option value="w">백</option>
                    <option value="b">흑</option>
                  </select>
                  <button id="assign-submit" class="full">플레이어 지정</button>
                </form>
                <button id="stop-game" class="full">대국 중단</button>
                <button id="prepare-game" class="full">새 대국 준비</button>
              </details>
              <ul id="room-players" aria-label="대국자"></ul>
              <div id="color-controls">
                <div
                  class="color-options"
                  role="group"
                  aria-label="내 색상 선택"
                >
                  <button id="choose-white" aria-pressed="false">백</button>
                  <button id="choose-black" aria-pressed="false">흑</button>
                </div>
                <p id="color-status" aria-live="polite" hidden></p>
                <div id="color-response" class="color-options" hidden>
                  <button id="accept-color">수락</button>
                  <button id="reject-color">거절</button>
                </div>
                <button id="cancel-color" class="full" hidden>요청 취소</button>
              </div>
              <button id="yield-seat" class="full" hidden>자리 양보</button>
              <p id="queue-status" aria-live="polite"></p>
              <ol id="room-queue" aria-label="방 대기열"></ol>
              <button id="leave-room" class="full">방 나가기</button>
            </div>
          </div>
        </section>
      </aside>
      <section class="arena" aria-label="대국 보드">
        <div class="turn-banner" aria-live="polite">
          <strong id="status-title"></strong
          ><span id="game-clock" aria-label="남은 시간" hidden></span
          ><span id="turn-number"></span>
        </div>
        <section class="panel opponent-panel" aria-label="상대 보관 기물">
          <div class="panel-title">
            <h2>기물</h2>
            <span id="opponent-color"></span>
          </div>
          <div id="opponent-reserves" class="opponent-reserves"></div>
        </section>
        <div class="board-frame">
          <div
            id="board"
            class="board"
            role="group"
            aria-label="Chessmoku 8 곱하기 8 보드"
          ></div>
        </div>
        <section class="panel reserve-panel">
          <div class="panel-title">
            <h2>기물</h2>
            <span id="reserve-color"></span>
          </div>
          <div id="reserves" class="reserves"></div>
        </section>
        <div class="board-toolbar">
          <button id="flip-board">보드 뒤집기</button
          ><button id="undo">무르기</button
          ><button id="reject-undo" hidden>거절</button
          ><button id="reopen-result" hidden>결과 · 재대국</button>
        </div>
        <p id="status-detail" role="status" hidden></p>
      </section>
      <aside id="history-slot" class="history-sidebar">
        <section class="panel history-panel">
          <div class="panel-title">
            <h2>기보</h2>
            <span id="move-count">0수</span>
          </div>
          <div class="history-head">
            <span>수</span><span>백</span><span>흑</span>
          </div>
          <div id="history" class="history"></div>
          <div class="history-actions">
            <button id="export-game">기보 저장</button
            ><button id="resign">기권</button>
          </div>
        </section>
      </aside>
    </main>
    <dialog id="panel-dialog" aria-label="대국 정보">
      <button id="close-panel" class="close" aria-label="닫기">×</button>
      <div id="panel-content"></div>
    </dialog>
    <div id="toast" class="toast" role="status" hidden></div>
    <dialog id="confirm-dialog">
      <h2 id="confirm-title"></h2>
      <p id="confirm-detail"></p>
      <div class="dialog-buttons">
        <button id="confirm-cancel">취소</button
        ><button id="confirm-ok">확인</button>
      </div>
    </dialog>
    <dialog id="result-dialog">
      <button class="close-dialog close" aria-label="닫기">×</button>
      <h2 id="result-title"></h2>
      <p id="result-detail"></p>
      <div class="dialog-buttons">
        <button id="play-again">다시 대국하기</button
        ><button class="close-dialog">보드 살펴보기</button>
      </div>
    </dialog>
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
